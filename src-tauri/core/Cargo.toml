[package]
name = "calendar-core"
version = "0.1.0"
edition = "2021"
description = "데스크 캘린더의 화면과 상관없는 로직: 날짜, 음력, 공휴일, 반복 일정, 저장소, 알림 계산"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: 저장 파일의 키 순서를 예전(JS) 앱과 같게 유지
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
