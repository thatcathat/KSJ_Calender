# v로 시작하는 태그(예: v2.0.0)를 push하면 Windows에서 테스트·빌드해 GitHub Releases에 올린다.
# 설치 파일과 함께 올라가는 latest.json을 보고 설치된 앱들이 자동 업데이트한다.
# 업데이트 서명에 저장소 비밀값 TAURI_SIGNING_PRIVATE_KEY가 필요하다(README '새 버전 배포' 참고).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # Release 만들기·파일 올리기

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: 태그와 package.json 버전 확인
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 package.json 버전($v)이 달라요."
            exit 1
          fi

      - run: npm test

      - name: 빌드 (설치 파일과 업데이트 서명)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npx tauri build

      - name: Release에 올리기
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          node scripts/release-files.mjs "$ver" "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" release
          gh release create "$GITHUB_REF_NAME" --title "$ver" --generate-notes \
            "release/DeskCalendar-Setup-$ver.exe" \
            release/latest.json
